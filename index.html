<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b7a78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beograd">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Белград · путеводитель</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<style>
  @font-face{
    font-family:'Pro SRB';
    src:url('fonts/ProSRB.woff2') format('woff2'), url('fonts/ProSRB.otf') format('opentype');
    font-weight:normal;font-style:normal;font-display:swap;
  }
  :root{
    --font-title:'Pro SRB', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    --ink:#22222a; --muted:#7a7a86; --paper:#ffffff;
    --accent:#2b7a78;
    --shadow:0 8px 30px rgba(0,0,0,.16);
    --radius:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
  #map{position:fixed;inset:0;z-index:0;background:#e8e8e8}

  /* Заголовок */
  .topbar{
    position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:600;
    background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
    border-radius:14px;padding:9px 13px;box-shadow:var(--shadow);
    max-width:min(64vw,290px);
  }
  .topbar h1{margin:0;font-size:17px;letter-spacing:.02em;font-family:var(--font-title)}
  .topbar p{margin:2px 0 0;font-size:11px;color:var(--muted)}

  /* Переключатель языка */
  .langsw{
    position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:600;
    display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
    border-radius:12px;box-shadow:var(--shadow);overflow:hidden;
  }
  .langsw button{
    border:none;background:none;cursor:pointer;font-size:12.5px;font-weight:700;
    color:var(--muted);padding:9px 11px;transition:.15s;
  }
  .langsw button.on{background:var(--accent);color:#fff}

  /* Кнопки-действия */
  .fabs{position:fixed;right:12px;bottom:calc(12px + var(--sheet-h,0px) + env(safe-area-inset-bottom,0px));z-index:600;
    display:flex;flex-direction:column;gap:10px;transition:bottom .25s ease}
  .fabs.hide{display:none}
  .fab{
    min-width:48px;height:48px;padding:0 16px;border:none;cursor:pointer;
    background:var(--paper);color:var(--ink);border-radius:24px;box-shadow:var(--shadow);
    font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;justify-content:center;
  }
  .fab:active{transform:scale(.96)}
  .fab.primary{background:var(--accent);color:#fff}
  .fab .ic{font-size:17px;line-height:1}

  /* Трей выбора мест для маршрута */
  .tray{
    position:fixed;left:12px;right:12px;bottom:calc(14px + var(--sheet-h,0px) + env(safe-area-inset-bottom,0px));
    z-index:660;background:var(--ink);color:#fff;border-radius:16px;
    box-shadow:var(--shadow);padding:10px 12px;display:none;align-items:center;gap:10px;
  }
  .tray.show{display:flex}
  .tray-info{flex:1;font-size:14px;font-weight:600}
  .tray-btn{border:none;border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}
  .tray-btn.ghost{background:rgba(255,255,255,.16);color:#fff}
  .tray-btn:disabled{opacity:.4}

  /* Нижняя карточка */
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:650;
    background:var(--paper);border-radius:var(--radius) var(--radius) 0 0;
    box-shadow:0 -10px 40px rgba(0,0,0,.18);
    transform:translateY(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    max-height:74vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .sheet.open{transform:translateY(0)}
  .sheet-grab{width:40px;height:4px;border-radius:2px;background:#d5d5dd;margin:8px auto 4px;flex:none}
  .sheet-head{display:flex;align-items:center;gap:10px;padding:4px 18px 10px;flex:none}
  .sheet-head .title{flex:1;min-width:0}
  .sheet-head h2{margin:0;font-size:22px;line-height:1.15;font-family:var(--font-title);letter-spacing:.01em}
  .sheet-head .sub{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .sheet-close{border:none;background:#f1f1f4;width:32px;height:32px;border-radius:50%;font-size:17px;cursor:pointer;color:var(--muted);flex:none}
  .sheet-body{overflow-y:auto;padding:0 18px 22px;-webkit-overflow-scrolling:touch}
  .sheet-body p{font-size:14px;line-height:1.6;color:#3a3a44;margin:0 0 14px}

  .swatch{display:inline-block;width:12px;height:12px;border-radius:3px;flex:none}

  .list{list-style:none;margin:0;padding:0}
  .list li{display:flex;align-items:center;gap:11px;padding:11px 6px;border-bottom:1px solid #f0f0f3;cursor:pointer}
  .list li:last-child{border-bottom:none}
  .list li:active{background:#f7f7fa}
  .list .nm{flex:1;min-width:0;font-size:14.5px}
  .list .nm small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .list .dist{font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
  .list .cnt{font-size:12px;color:var(--muted)}
  .list .num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}

  .btn{
    display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;
    text-decoration:none;padding:12px 16px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .btn.ghost{background:#f1f1f4;color:var(--ink)}
  .btn.block{width:100%;justify-content:center;margin-top:10px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}
  .head{font-size:13px;font-weight:400;letter-spacing:.06em;color:var(--muted);margin:16px 0 4px;font-family:var(--font-title)}
  .head:first-child{margin-top:4px}
  .ru-note{font-size:11.5px;color:var(--muted);font-style:italic;margin:-6px 0 14px}
  .poi-photo{width:100%;height:190px;object-fit:cover;border-radius:12px;margin:0 0 14px;background:#ececef;display:block}
  .photo-credit{display:inline-block;font-size:11px;color:var(--muted);text-decoration:none;margin-top:12px}
  .photo-credit:hover{color:var(--ink)}

  /* Метки POI */
  .poi-pin{
    width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
    border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;transition:box-shadow .15s;
  }
  .poi-pin span{transform:rotate(45deg);font-size:13px;line-height:1}
  .poi-pin.sel{box-shadow:0 0 0 3px var(--accent),0 2px 8px rgba(0,0,0,.4)}
  .poi-pin .fav-badge{position:absolute;right:-6px;top:-6px;width:15px;height:15px;border-radius:50%;border:1.5px solid #fff;display:none;align-items:center;justify-content:center;font-size:9px;line-height:1;color:#fff;transform:rotate(45deg)}
  .poi-pin.fav-want .fav-badge{display:flex;background:#e8a13a}
  .poi-pin.fav-want .fav-badge::before{content:"★"}
  .poi-pin.fav-visited .fav-badge{display:flex;background:#2e9e5b}
  .poi-pin.fav-visited .fav-badge::before{content:"✓"}
  .favbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--color-border,#e2e2e6);background:#f6f6f8;color:var(--ink);border-radius:12px;padding:11px 10px;font-size:13.5px;font-weight:600;cursor:pointer}
  .favbtn.on[data-fav="want"]{background:#fbeccb;border-color:#e8a13a;color:#8a5a12}
  .favbtn.on[data-fav="visited"]{background:#dff2e5;border-color:#2e9e5b;color:#1c6b3c}
  .stopnum{
    width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;
    border:2px solid #fff;font-size:12px;font-weight:700;box-shadow:0 2px 5px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;
  }

  .user-dot{width:16px;height:16px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);position:relative}
  .user-dot::after{content:"";position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:rgba(26,115,232,.45);animation:userpulse 2s ease-out infinite}
  @keyframes userpulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(3);opacity:0}}
  .leaflet-container{background:#e8e8e8}
  .leaflet-tile-pane{filter:saturate(.5) brightness(1.06) contrast(.96)}
  #loader{position:fixed;inset:0;z-index:2000;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:opacity .45s ease}
  #loader.hidden{opacity:0;pointer-events:none}
  #loader img{width:min(62vw,290px);height:auto;display:block}
  #loader .ldr-title{font-family:var(--font-title);font-size:30px;letter-spacing:.07em;margin-top:-6px;display:flex}
  #loader .ldr-title span{animation:bgtitle 4.5s linear infinite}
  #loader .ldr-title span:nth-child(2){animation-delay:-.5s}
  #loader .ldr-title span:nth-child(3){animation-delay:-1s}
  #loader .ldr-title span:nth-child(4){animation-delay:-1.5s}
  #loader .ldr-title span:nth-child(5){animation-delay:-2s}
  #loader .ldr-title span:nth-child(6){animation-delay:-2.5s}
  #loader .ldr-title span:nth-child(7){animation-delay:-3s}
  @keyframes bgtitle{0%{color:#019F69}11%{color:#0263FF}22%{color:#055E00}33%{color:#8FD969}44%{color:#923545}55%{color:#95CBFB}66%{color:#E7B780}77%{color:#F6765E}88%{color:#FC3030}100%{color:#019F69}}
  .toast{
    position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:900;
    background:rgba(30,30,36,.94);color:#fff;padding:10px 16px;border-radius:12px;
    font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .25s;max-width:80vw;text-align:center;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
  <div id="loader">
    <picture>
      <source srcset="loader.webp" type="image/webp">
      <img src="loader.apng" alt="" width="290">
    </picture>
    <div class="ldr-title"><span>B</span><span>E</span><span>O</span><span>G</span><span>R</span><span>A</span><span>D</span></div>
  </div>
  <div id="map"></div>

  <div class="topbar">
    <h1 id="appTitle">Белград</h1>
    <p id="appSub"></p>
  </div>

  <div class="langsw" id="langsw">
    <button data-lang="sr">SR</button>
    <button data-lang="en">EN</button>
    <button data-lang="ru">RU</button>
  </div>

  <div class="fabs" id="fabs">
    <button class="fab" id="savedBtn"><span class="ic">⭐</span><span class="lbl"></span></button>
    <button class="fab" id="routesBtn"><span class="ic">🧭</span><span class="lbl"></span></button>
    <button class="fab" id="nearbyBtn"><span class="ic">✦</span><span class="lbl"></span></button>
    <button class="fab primary" id="locBtn"><span class="ic">◎</span><span class="lbl"></span></button>
  </div>

  <div class="tray" id="tray">
    <span class="tray-info" id="trayInfo"></span>
    <button class="tray-btn ghost" id="trayCancel"></button>
    <button class="tray-btn" id="trayBuild" disabled></button>
  </div>

  <div class="sheet" id="sheet">
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <div class="title">
        <h2 id="sheetTitle"></h2>
        <div class="sub" id="sheetSub"></div>
      </div>
      <button class="sheet-close" id="sheetClose">×</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

const STR = {

// Названия районов на 3 языках (перекрывают properties.name из GeoJSON)
const NAMES = {

// Описания районов (пока русский)
const ABOUT = {
 "stari-grad":"Историческое ядро на стрелке Савы и Дуная: Калемегдан, пешеходная Кнез-Михайлова, Скадарлия и площадь Республики.",

  name:{ru:"Монастырь Раковица",en:"Rakovica Monastery",sr:"Манастир Раковица"},
  nl:"Manastir Rakovica",
  story:"Средневековый монастырь, по преданию связанный с деспотом Стефаном Лазаревичем. Место упокоения патриарха Павла — почитаемого предстоятеля Сербской церкви; тихий оазис на юге города.",img:"img/rakovica-manastir.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%9C%D0%B0%D0%BD%D0%B0%D1%81%D1%82%D0%B8%D1%80_%D0%A0%D0%B0%D0%BA%D0%BE%D0%B2%D0%B8%D1%86%D0%B0",gq:"Manastir Rakovica, Beograd"},
 {id:"waterfront",op:"savski-venac",ll:[44.80545,20.44671],emoji:"🌆",
  name:{ru:"Белград на воде",en:"Belgrade Waterfront",sr:"Београд на води"},
  nl:"Beograd na vodi",
  story:"Современный жилой и деловой квартал на правом берегу Савы, построенный в 2010-х годах на месте бывшей грузовой станции. Его доминанта — башня «Кула Београд», самое высокое здание страны со смотровой площадкой; вдоль реки проложена новая набережная с кафе и парком.",img:"img/waterfront.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%9A%D1%83%D0%BB%D0%B0_%D0%91%D0%B5%D0%BE%D0%B3%D1%80%D0%B0%D0%B4",gq:"Kula Beograd, Beograd"},
 {id:"dorcol",op:"stari-grad",ll:[44.82263,20.46148],emoji:"🏘️",
  name:{ru:"Дорчол",en:"Dorćol",sr:"Дорћол"},
  nl:"Dorćol",
  story:"Один из старейших кварталов города, спускающийся от Калемегдана к Дунаю. Название пришло из турецкого «dört yol» — «четыре дороги». Веками здесь соседствовали разные общины и ремёсла; сегодня Дорчол — уютный район с тихими улицами, кофейнями и мастерскими.",img:"img/dorcol.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%94%D0%BE%D1%80%D1%9B%D0%BE%D0%BB",gq:"Dorćol, Beograd"},
 {id:"kosancicev-venac",op:"stari-grad",ll:[44.81692,20.45293],emoji:"🌅",
  name:{ru:"Косанчичев венац",en:"Kosančićev Venac",sr:"Косанчићев венац"},
  nl:"Kosančićev venac",
  story:"Живописный старый квартал на откосе над Савой, с брусчаткой и домами XIX века. Здесь стояло здание Народной библиотеки, утраченное в 1941 году. Сегодня это одно из самых атмосферных мест старого Белграда с видом на реку и закаты.",img:"img/kosancicev-venac.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%9A%D0%BE%D1%81%D0%B0%D0%BD%D1%87%D0%B8%D1%9B%D0%B5%D0%B2_%D0%B2%D0%B5%D0%BD%D0%B0%D1%86",gq:"Kosančićev venac, Beograd"},
 {id:"stari-dvor",op:"stari-grad",ll:[44.81085,20.4626],emoji:"🏛️",
  name:{ru:"Старый дворец",en:"Old Palace",sr:"Стари двор"},
  nl:"Stari dvor",
  story:"Старый дворец (1884) — бывшая королевская резиденция в стиле академизма, окружённая парком с фонтанами. Сегодня в нём заседает городская Скупщина Белграда; напротив стоит Новый дворец.",img:"img/stari-dvor.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%A1%D1%82%D0%B0%D1%80%D0%B8_%D0%B4%D0%B2%D0%BE%D1%80",gq:"Stari dvor, Beograd"},
 {id:"beton-hala",op:"stari-grad",ll:[44.81986,20.44843],emoji:"🍽️",
  name:{ru:"Бетон-хала",en:"Beton Hala",sr:"Бетон хала"},
  nl:"Beton hala",
  story:"Бывшие портовые склады у Савы, ставшие оживлённой набережной с ресторанами и видом на Бранков мост и Нови-Београд. Популярное место вечерних прогулок у самой воды.",img:"img/beton-hala.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%91%D0%B5%D1%82%D0%BE%D0%BD_%D1%85%D0%B0%D0%BB%D0%B0",gq:"Beton hala, Beograd"},
 {id:"zemunski-kej",op:"zemun",ll:[44.8455,20.41544],emoji:"⚓",
  name:{ru:"Земунская набережная",en:"Zemun Quay",sr:"Земунски кеј"},
  nl:"Zemunski kej",
  story:"Дунайская набережная старого Земуна — длинная зелёная променада вдоль реки с видом на воду, лодки и традиционные рыбные рестораны. Любимое место прогулок горожан.",img:"img/zemunski-kej.png",wiki:"https://sr.wikipedia.org/wiki/%D0%97%D0%B5%D0%BC%D1%83%D0%BD%D1%81%D0%BA%D0%B8_%D0%BA%D0%B5%D1%98",gq:"Zemunski kej, Zemun"},
 {id:"most-na-adi",op:"novi-beograd",ll:[44.797,20.42589],emoji:"🌉",
  name:{ru:"Мост на Аде",en:"Ada Bridge",sr:"Мост на Ади"},
  nl:"Most na Adi",
  story:"Вантовый мост через Саву (2012) с одним высоким пилоном, от которого веером расходятся тросы — заметный современный силуэт города. Проходит рядом с островом Ада-Циганлия.",img:"img/most-na-adi.jpg",wiki:"https://sr.wikipedia.org/wiki/Most_na_Adi",gq:"Most na Adi, Beograd"},
 {id:"nebojsa",op:"stari-grad",ll:[44.82734,20.44789],emoji:"🗼",
  name:{ru:"Башня Небойша",en:"Nebojša Tower",sr:"Кула Небојша"},
  nl:"Kula Nebojša",
  story:"Речная дозорная башня XV века, охранявшая порт крепости; при османах служила тюрьмой. Сегодня — музей и один из немногих уцелевших объектов средневекового Белграда времён деспота Стефана Лазаревича.",img:"img/nebojsa.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%9A%D1%83%D0%BB%D0%B0_%D0%9D%D0%B5%D0%B1%D0%BE%D1%98%D1%88%D0%B0",gq:"Kula Nebojša, Beograd"},
 {id:"kafana-znak",op:"stari-grad",ll:[44.81767,20.45256],emoji:"☕",
  name:{ru:"Кафана «Знак вопроса»",en:"The “?” Tavern",sr:"Кафана „?“"},
  nl:"Kafana Znak pitanja",
  story:"Старейшая действующая кафана Белграда напротив Соборной церкви. Загадочное имя возникло из-за спора с церковью о вывеске: временный знак вопроса так и стал постоянным названием.",img:"img/kafana-znak.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%9A%D0%B0%D1%84%D0%B0%D0%BD%D0%B0_%3F",gq:"Znak pitanja kafana, Beograd"},
 {id:"vuk-dositej",op:"stari-grad",ll:[44.82103,20.45877],emoji:"📜",
  name:{ru:"Музей Вука и Доситея",en:"Museum of Vuk and Dositej",sr:"Музеј Вука и Доситеја"},
  nl:"Muzej Vuka i Dositeja",
  story:"В одном из старейших сохранившихся зданий османской архитектуры города. Посвящён Вуку Караджичу — реформатору языка и создателю современной сербской кириллицы — и просветителю Доситею Обрадовичу.",img:"img/vuk-dositej.png",wiki:"https://sr.wikipedia.org/wiki/%D0%9C%D1%83%D0%B7%D0%B5%D1%98_%D0%92%D1%83%D0%BA%D0%B0_%D0%B8_%D0%94%D0%BE%D1%81%D0%B8%D1%82%D0%B5%D1%98%D0%B0",gq:"Muzej Vuka i Dositeja, Beograd"},
 {id:"nb-srbije",op:"vracar",ll:[44.79755,20.46717],emoji:"📚",
  name:{ru:"Народная библиотека Сербии",en:"National Library of Serbia",sr:"Народна библиотека Србије"},
  nl:"Narodna biblioteka Srbije",
  story:"Здание 1973 года у Храма Св. Саввы — новая национальная библиотека взамен уничтоженной в 1941-м на Косанчичевом венце. Институт восстановили, но на другом месте; прежнее осталось пустым.",img:"img/nb-srbije.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%9D%D0%B0%D1%80%D0%BE%D0%B4%D0%BD%D0%B0_%D0%B1%D0%B8%D0%B1%D0%BB%D0%B8%D0%BE%D1%82%D0%B5%D0%BA%D0%B0_%D0%A1%D1%80%D0%B1%D0%B8%D1%98%D0%B5",gq:"Narodna biblioteka Srbije, Beograd"},
 {id:"kalenic",op:"vracar",ll:[44.8014,20.47603],emoji:"🍅",
  name:{ru:"Рынок Каленич",en:"Kalenić Market",sr:"Пијаца Каленић"},

  story:"Крупнейший действующий зелёный рынок Белграда: открытая часть с овощами и фруктами и закрытый павильон с сыром, яйцами и мясом. Живой, нетуристический слой города.",img:"img/kalenic.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%9F%D0%B8%D1%98%D0%B0%D1%86%D0%B0_%D0%9A%D0%B0%D0%BB%D0%B5%D0%BD%D0%B8%D1%9B",gq:"Kalenićeva pijaca, Beograd"},
 {id:"vuk-monument",op:"palilula",ll:[44.80487,20.47766],emoji:"🗿",

  nl:"Spomenik Vuku Karadžiću",
  story:"Памятник 1937 года реформатору сербского языка. Место дало разговорное имя всему кварталу и станции — «Вуков споменик»: так называют район, а не саму скульптуру.",img:"img/vuk-monument.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%A1%D0%BF%D0%BE%D0%BC%D0%B5%D0%BD%D0%B8%D0%BA_%D0%92%D1%83%D0%BA%D1%83_%D0%9A%D0%B0%D1%80%D0%B0%D1%9F%D0%B8%D1%9B%D1%83_(%D0%91%D0%B5%D0%BE%D0%B3%D1%80%D0%B0%D0%B4)",gq:"Spomenik Vuku Karadžiću, Beograd"},
 {id:"cubura",op:"vracar",ll:[44.7981,20.47564],emoji:"🏘️",
  name:{ru:"Чубура",en:"Čubura",sr:"Чубура"},

  story:"Историческое ядро Врачара: низкая плотная застройка, дворы и кафаны — классический образ «старого белградского двора» у подножия Храма Св. Саввы.",img:"img/cubura.jpg",wiki:"https://en.wikipedia.org/wiki/%C4%8Cubura",gq:"Čubura, Beograd"},
 {id:"slavija",op:"vracar",ll:[44.8025,20.4667],emoji:"🔄",
  name:{ru:"Площадь Славия",en:"Slavija Square",sr:"Трг Славија"},
  nl:"Trg Slavija",
  story:"Крупнейший круговой перекрёсток города и главный транспортный узел. Название — от стоявшего здесь отеля «Славия». Отдельный персонаж городского фольклора.",img:"img/slavija.png",wiki:"https://sr.wikipedia.org/wiki/%D0%A1%D0%BB%D0%B0%D0%B2%D0%B8%D1%98%D0%B0",gq:"Trg Slavija, Beograd"},
 {id:"beli-dvor",op:"savski-venac",ll:[44.7657,20.45334],emoji:"🏛️",
  name:{ru:"Белый дворец",en:"White Palace",sr:"Бели двор"},
  nl:"Beli dvor",
  story:"Часть королевского комплекса на Дединье (1934–1937), резиденция династии Карагеоргиевичей. Дединье — самый закрытый район города. Посещение только с экскурсией.",img:"img/beli-dvor.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%91%D0%B5%D0%BB%D0%B8_%D0%B4%D0%B2%D0%BE%D1%80",gq:"Beli dvor, Dedinje, Beograd"},
 {id:"african-art",op:"savski-venac",ll:[44.78911,20.43504],emoji:"🎭",

  nl:"Muzej afričke umetnosti",
  story:"Единственный музей такого профиля в регионе (1977), на коллекции супругов Марьянович. Материальный след политики Движения неприсоединения: Югославия строила связи со странами Африки.",img:"img/african-art.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%9C%D1%83%D0%B7%D0%B5%D1%98_%D0%B0%D1%84%D1%80%D0%B8%D1%87%D0%BA%D0%B5_%D1%83%D0%BC%D0%B5%D1%82%D0%BD%D0%BE%D1%81%D1%82%D0%B8_(%D0%91%D0%B5%D0%BE%D0%B3%D1%80%D0%B0%D0%B4)",gq:"Muzej afričke umetnosti, Beograd"},
 {id:"old-station",op:"savski-venac",ll:[44.8086,20.4557],emoji:"🚂",
  name:{ru:"Старый железнодорожный вокзал",en:"Old Railway Station",sr:"Стара железничка станица"},
  nl:"Stara železnička stanica",
  story:"Главный вокзал Белграда более 130 лет (1884), закрыт в 2018-м. Через него проходил Восточный экспресс. Сегодня — историческое здание преобразованной Савской площади с памятником Стефану Немане.",img:"img/old-station.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%96%D0%B5%D0%BB%D0%B5%D0%B7%D0%BD%D0%B8%D1%87%D0%BA%D0%B0_%D1%81%D1%82%D0%B0%D0%BD%D0%B8%D1%86%D0%B0_%D0%9D%D0%BE%D0%B2%D0%B8_%D0%A1%D0%B0%D0%B4",gq:"Stara železnička stanica, Beograd"},
 {id:"senjak",op:"savski-venac",ll:[44.79133,20.43587],emoji:"🌳",
  name:{ru:"Сеняк",en:"Senjak",sr:"Сењак"},
  nl:"Senjak",
  story:"Элитный район вилл на возвышенности. Название — от «сено»: здесь складывали сено, которое приказали вынести за пределы города из-за пожарной опасности.",img:"img/senjak.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%A1%D0%B5%D1%9A%D0%B0%D0%BA",gq:"Senjak, Beograd"},
 {id:"tasmajdan",op:"palilula",ll:[44.80922,20.4706],emoji:"⛲",
  name:{ru:"Ташмайдан",en:"Tašmajdan",sr:"Ташмајдан"},
  nl:"Tašmajdan",
  story:"Название от турецкого «taş meydan» — «каменное поле», каменоломня. Отсюда веками добывали камень, которым строили и мостили Белград; под парком сохранились подземные выработки.",img:"img/tasmajdan.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%A2%D0%B0%D1%88%D0%BC%D0%B0%D1%98%D0%B4%D0%B0%D0%BD",gq:"Tašmajdan park, Beograd"},
 {id:"russian-church",op:"palilula",ll:[44.81058,20.4687],emoji:"⛪",
  name:{ru:"Русская церковь Св. Троицы",en:"Russian Church",sr:"Руска црква"},
  nl:"Ruska crkva",
  story:"Храм 1924 года для русских эмигрантов первой волны, прибывших после революции. Здесь погребён генерал Пётр Врангель. Материальный след русской эмиграции в Белграде.",img:"img/russian-church.jpg",wiki:"https://sr.wikipedia.org/wiki/%D0%A0%D1%83%D1%81%D0%BA%D0%B0_%D0%BF%D1%80%D0%B0%D0%B2%D0%BE%D1%81%D0%BB%D0%B0%D0%B2%D0%BD%D0%B0_%D1%86%D1%80%D0%BA%D0%B2%D0%B0",gq:"Ruska crkva Svete Trojice, Beograd"},
 {id:"karaburma",op:"palilula",ll:[44.81307,20.51256],emoji:"🏢",
  name:{ru:"Карабурма",en:"Karaburma",sr:"Карабурма"},
  nl:"Karaburma",
  story:"Район с османским названием, ставший в социалистический период рабочим и промышленным. Плотная жилая застройка второй половины XX века — «неглянцевый» Белград.",img:"https://upload.wikimedia.org/wikipedia/commons/5/58/Location_map_Belgrade_Central.png",wiki:"https://sr.wikipedia.org/wiki/%D0%9A%D0%B0%D1%80%D0%B0%D0%B1%D1%83%D1%80%D0%BC%D0%B0",gq:"Karaburma, Beograd"},
 {id:"ada-huja",op:"palilula",ll:[44.82305,20.52616],emoji:"🏭",
  name:{ru:"Ада Хуя",en:"Ada Huja",sr:"Ада Хуја"},
  nl:"Ada Huja",
  story:"Бывший дунайский остров, соединённый с берегом и ставший промзоной; самая низкая точка Белграда (~70 м). Ещё один остров, переставший быть островом, — след того, как город переписывал русла своих рек.",img:"https://upload.wikimedia.org/wikipedia/commons/5/58/Location_map_Belgrade_Central.png",wiki:"https://sr.wikipedia.org/wiki/%D0%90%D0%B4%D0%B0_%D0%A5%D1%83%D1%98%D0%B0",gq:"Ada Huja, Beograd"},
 {id:"zvezdarska-suma",op:"zvezdara",ll:[44.80383,20.50555],emoji:"🌲",

  story:"Лесной массив вокруг обсерватории, охраняемый природный объект и главная зелёная зона востока города — место, где город физически отступает.",img:"img/zvezdarska-suma.jpg",wiki:"https://en.wikipedia.org/wiki/Zvezdara_Forest",gq:"Zvezdarska šuma, Beograd"},
 {id:"djeram",op:"zvezdara",ll:[44.80036,20.48743],emoji:"🍏",

  nl:"Pijaca Đeram",
  story:"Один из старых районных рынков. Название «ђерам» — колодезный журавль, водоподъёмное устройство, некогда стоявшее здесь. Топоним от давно исчезнувшего объекта.",img:"img/djeram.png",wiki:"https://sr.wikipedia.org/wiki/%D0%82%D0%B5%D1%80%D0%B0%D0%BC_(%D0%97%D0%B2%D0%B5%D0%B7%D0%B4%D0%B0%D1%80%D0%B0)",gq:"Đeram pijaca, Beograd"},
 {id:"cvetkova",op:"zvezdara",ll:[44.79333,20.50353],emoji:"🥬",

const map = L.map('map',{zoomControl:false}).setView([44.805,20.46],11);
L.control.zoom({position:'bottomleft'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap</a>',
  subdomains:'abc', maxZoom:19
}).addTo(map);

const opById = {};
let activeLayer = null;
const routeGroup = L.layerGroup().addTo(map);

function renderOpstine(geo){
  const gj = L.geoJSON(geo,{
    style:f=>({color:'#ffffff',weight:1.5,fillColor:f.properties.color,fillOpacity:.5}),
    onEachFeature:(f,layer)=>{
      const p=f.properties;
      opById[p.slug]={layer,name:p.name,color:p.color};
      layer.on('click',()=>selectOpstina(p.slug));
      layer.on('mouseover',()=>layer.setStyle({fillOpacity:.68}));
      layer.on('mouseout',()=>{ if(layer!==activeLayer) layer.setStyle({fillOpacity:.5}); });
    }
  }).addTo(map);
  map.fitBounds(gj.getBounds(),{padding:[20,20]});
  addPois();
}

const poiMarkers={};
function addPois(){
  POIS.forEach(poi=>{
    const color=(opById[poi.op]||{}).color||'#2b7a78';
    const icon=L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,26],
      html:`<div class="poi-pin" style="background:${color}"><span>${poi.emoji}</span><b class="fav-badge"></b></div>`});
    const m=L.marker(poi.ll,{icon}).addTo(map);
    m.on('click',()=>{ if(selecting) toggleSelect(poi.id); else selectPoi(poi.id); });
    poiMarkers[poi.id]=m;
    setPinFav(poi.id);
  });
}
function pinEl(id){ const m=poiMarkers[id]; const el=m&&m.getElement(); return el&&el.querySelector('.poi-pin'); }

/* ═══════════ ИЗБРАННОЕ ═══════════ */
let favs = JSON.parse(localStorage.getItem('bg_favs')||'{}');   // id -> 'want' | 'visited'
function setPinFav(id){
  const el=pinEl(id); if(!el) return;
  el.classList.remove('fav-want','fav-visited');
  if(favs[id]) el.classList.add('fav-'+favs[id]);
}
function setFav(id,state){
  if(favs[id]===state) delete favs[id]; else favs[id]=state;
  localStorage.setItem('bg_favs',JSON.stringify(favs));
  setPinFav(id);
  if(currentView&&currentView.type==='poi'&&currentView.id===id) renderPoi(id);
  if(currentView&&currentView.type==='saved') renderSaved();
}

/* ═══════════ ГЕОЛОКАЦИЯ ═══════════ */
let userMarker=null, accCircle=null, userLL=null, watchId=null;
const locBtn=document.getElementById('locBtn');
function startLocate(auto){
  if(!('geolocation' in navigator)){ if(!auto) toast(t('geoNo')); return; }
  if(!auto) toast(t('locating'));
  if(watchId!==null) navigator.geolocation.clearWatch(watchId);
  watchId=navigator.geolocation.watchPosition(pos=>{
    const {latitude,longitude,accuracy}=pos.coords;
    userLL=[latitude,longitude];
    if(!userMarker){
      const dot=L.divIcon({className:'',iconSize:[16,16],iconAnchor:[8,8],
        html:'<div class="user-dot"></div>'});
      userMarker=L.marker(userLL,{icon:dot,zIndexOffset:1000}).addTo(map);
      accCircle=L.circle(userLL,{radius:accuracy,color:'#1a73e8',weight:1,fillColor:'#1a73e8',fillOpacity:.12}).addTo(map);
      const inBG = latitude>44.2 && latitude<45.05 && longitude>19.9 && longitude<20.9;
      if(inBG) map.setView(userLL, Math.max(map.getZoom(),15));
      toast(t('youHere'));
    }else{ userMarker.setLatLng(userLL); accCircle.setLatLng(userLL).setRadius(accuracy); }
    locBtn.querySelector('.ic').textContent='◉';
  },err=>{
    if(auto) return;
    const m={1:t('geoDenied'),2:t('geoFail'),3:t('geoTimeout')}[err.code]||t('geoFail');
    toast(m+' '+t('needHttps'));
  },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}
locBtn.addEventListener('click',()=>{ if(userLL) map.setView(userLL,16); else startLocate(); });

/* ═══════════ ПАНЕЛЬ + РОУТЕР ВИДОВ ═══════════ */
const sheet=document.getElementById('sheet');
const sheetTitle=document.getElementById('sheetTitle');
const sheetSub=document.getElementById('sheetSub');
const sheetBody=document.getElementById('sheetBody');
document.getElementById('sheetClose').addEventListener('click',closeSheet);
let currentView=null;   // {type, ...} — чтобы перерисовать при смене языка

function openSheet(){ sheet.classList.add('open'); requestAnimationFrame(syncFabs); }
function closeSheet(){ sheet.classList.remove('open'); document.documentElement.style.setProperty('--sheet-h','0px'); clearActive(); currentView=null; }
function syncFabs(){ document.documentElement.style.setProperty('--sheet-h', sheet.classList.contains('open')? sheet.offsetHeight+'px':'0px'); }
window.addEventListener('resize',syncFabs);

function clearActive(){ if(activeLayer){ activeLayer.setStyle({fillOpacity:.5,weight:1.5}); activeLayer=null; } }
function highlightOp(slug){
  clearActive(); const o=opById[slug]; if(!o) return;
  activeLayer=o.layer; o.layer.setStyle({fillOpacity:.78,weight:3}); o.layer.bringToFront();
}

function render(){
  if(!currentView) return;
  switch(currentView.type){
    case 'districts': renderDistricts(); break;
    case 'district':  renderDistrict(currentView.slug); break;
    case 'poi':       renderPoi(currentView.id); break;
    case 'nearby':    renderNearby(); break;
    case 'routes':    renderRoutes(); break;
    case 'route':     renderRoute(); break;
    case 'saved':     renderSaved(); break;
  }
}

/* — Список районов — */
function showDistricts(){ currentView={type:'districts'}; renderDistricts(); openSheet(); }
function renderDistricts(){
  const poiCount={}; POIS.forEach(p=>poiCount[p.op]=(poiCount[p.op]||0)+1);
  const slugs=Object.keys(opById).sort((a,b)=>opName(a).localeCompare(opName(b),'ru'));
  sheetTitle.textContent=t('districtsTitle');
  sheetSub.textContent=t('districtsSub');
  sheetBody.innerHTML='<ul class="list">'+slugs.map(s=>{
    const o=opById[s], c=poiCount[s];
    return `<li data-op="${s}"><span class="swatch" style="background:${o.color}"></span>
      <span class="nm">${opName(s)}</span><span class="cnt">${c? c+' ★':''}</span></li>`;
  }).join('')+'</ul>';
  sheetBody.querySelectorAll('[data-op]').forEach(li=>li.addEventListener('click',()=>selectOpstina(li.dataset.op)));
}

/* — Один район — */
function selectOpstina(slug){
  const o=opById[slug]; if(!o) return;
  highlightOp(slug);
  map.fitBounds(o.layer.getBounds(),{padding:[40,40],maxZoom:14});
  currentView={type:'district',slug}; renderDistrict(slug); openSheet();
}
function renderDistrict(slug){
  const o=opById[slug]; highlightOp(slug);
  const pois=POIS.filter(p=>p.op===slug);
  sheetTitle.textContent=opName(slug);
  sheetSub.innerHTML=`<span class="swatch" style="background:${o.color}"></span> ${t('officialMuni')}`;
  let html=`<p>${ABOUT[slug]||''}</p>`;
  if(lang!=='ru' && ABOUT[slug]) html+=`<div class="ru-note">🇷🇺 ${t('ruOnly')}</div>`;
  if(pois.length){
    html+=`<div class="head">${t('attractions')} (${pois.length})</div><ul class="list">`+
      pois.map(p=>`<li data-poi="${p.id}"><span class="nm">${p.emoji} ${poiName(p)}</span></li>`).join('')+`</ul>`;
    if(pois.length>=2)
      html+=`<button class="btn block" id="drBtn">🧭 ${t('districtRoute')} (${pois.length})</button>`;
  }else{
    html+=`<div class="note">${t('noPlaces')}</div>`;
  }
  sheetBody.innerHTML=html;
  sheetBody.querySelectorAll('[data-poi]').forEach(li=>li.addEventListener('click',()=>selectPoi(li.dataset.poi)));
  const dr=document.getElementById('drBtn');
  if(dr) dr.addEventListener('click',()=>drawRoute(pois,{title:opName(slug)}));
}

/* — Одно место — */
function selectPoi(id){
  const poi=poiById[id]; if(!poi) return;
  highlightOp(poi.op);
  map.setView(poi.ll, Math.max(map.getZoom(),15),{animate:true});
  currentView={type:'poi',id}; renderPoi(id); openSheet();
}
function renderPoi(id){
  const poi=poiById[id]; const o=opById[poi.op]||{name:'',color:'#2b7a78'};
  sheetTitle.textContent=`${poi.emoji} ${poiName(poi)}`;
  sheetSub.innerHTML=`<span class="swatch" style="background:${o.color}"></span> ${opName(poi.op)}`;
  const [lat,lng]=poi.ll;
  let html='';
  if(poi.img) html+=`<img class="poi-photo" src="${poi.img}" alt="${poiName(poi)}" loading="lazy" onerror="this.style.display='none'">`;
  html+=`<p>${poi.story}</p>`;
  if(lang!=='ru') html+=`<div class="ru-note">🇷🇺 ${t('ruOnly')}</div>`;
  if(userLL) html+=`<div class="tag">📍 ${fmtDist(haversine(userLL,poi.ll))} ${t('fromYou')}</div>`;
  const s=favs[id];
  html+=`<div class="row" style="margin-top:8px">
    <button class="favbtn ${s==='want'?'on':''}" data-fav="want">☆ ${t('favWant')}</button>
    <button class="favbtn ${s==='visited'?'on':''}" data-fav="visited">✓ ${t('favVisited')}</button>
  </div>`;
  const gmq=encodeURIComponent(poi.gq||`${poiName(poi)}, Beograd`);
  html+=`<div class="row"><a class="btn" target="_blank" rel="noopener"
      href="https://www.google.com/maps/search/?api=1&query=${gmq}">📍 ${t('openMaps')}</a></div>`;
  if(poi.wiki) html+=`<a class="photo-credit" target="_blank" rel="noopener" href="${poi.wiki}">${t('photoSrc')} ↗</a>`;
  sheetBody.innerHTML=html;
  sheetBody.querySelectorAll('[data-fav]').forEach(b=>b.addEventListener('click',()=>setFav(id,b.dataset.fav)));
}

/* — Что рядом — */
function showNearby(){
  if(!userLL){ startLocate(); toast(t('locating')); }
  currentView={type:'nearby'}; renderNearby(); openSheet();
}
function renderNearby(){
  sheetTitle.textContent=t('nearbyTitle');
  sheetSub.textContent=t('nearbySub');
  let items=POIS.slice();
  if(userLL) items=items.map(p=>({p,d:haversine(userLL,p.ll)})).sort((a,b)=>a.d-b.d);
  else items=items.map(p=>({p,d:null}));
  sheetBody.innerHTML='<ul class="list">'+items.map(({p,d})=>{
    const o=opById[p.op]||{};
    return `<li data-poi="${p.id}"><span class="swatch" style="background:${o.color||'#ccc'}"></span>
      <span class="nm">${p.emoji} ${poiName(p)}<small>${opName(p.op)}</small></span>
      ${d!=null?`<span class="dist">${fmtDist(d)}</span>`:''}</li>`;
  }).join('')+'</ul>';
  sheetBody.querySelectorAll('[data-poi]').forEach(li=>li.addEventListener('click',()=>selectPoi(li.dataset.poi)));
}

/* — Избранное — */
function showSaved(){ currentView={type:'saved'}; renderSaved(); openSheet(); }
function renderSaved(){
  sheetTitle.textContent=t('saved');
  sheetSub.textContent='';
  const want=POIS.filter(p=>favs[p.id]==='want');
  const vis=POIS.filter(p=>favs[p.id]==='visited');
  const li=p=>`<li data-poi="${p.id}"><span class="swatch" style="background:${(opById[p.op]||{}).color||'#ccc'}"></span>
    <span class="nm">${p.emoji} ${poiName(p)}<small>${opName(p.op)}</small></span></li>`;
  let html='';
  if(!want.length&&!vis.length){ html=`<div class="note">${t('savedEmpty')}</div>`; }
  else{
    if(want.length) html+=`<div class="head">★ ${t('savedWant')} (${want.length})</div><ul class="list">${want.map(li).join('')}</ul>`;
    if(vis.length)  html+=`<div class="head">✓ ${t('savedVisited')} (${vis.length})</div><ul class="list">${vis.map(li).join('')}</ul>`;
  }
  sheetBody.innerHTML=html;
  sheetBody.querySelectorAll('[data-poi]').forEach(el=>el.addEventListener('click',()=>selectPoi(el.dataset.poi)));
}

/* — Маршруты (панель) — */
function showRoutes(){ currentView={type:'routes'}; renderRoutes(); openSheet(); }
function renderRoutes(){
  sheetTitle.textContent=t('routesTitle');
  sheetSub.textContent='';
  let html=`<div class="head">${t('presetsHead')}</div><ul class="list">`+
    PRESETS.map(pr=>`<li data-preset="${pr.id}"><span class="nm">${pr.emoji} ${presetName(pr)}
      <small>${pr.stops.length} ★</small></span></li>`).join('')+`</ul>`;
  html+=`<div class="head">${t('customHead')}</div>
    <button class="btn block ghost" id="ownBtn">➕ ${t('makeOwn')}</button>`;
  sheetBody.innerHTML=html;
  sheetBody.querySelectorAll('[data-preset]').forEach(li=>li.addEventListener('click',()=>{
    const pr=PRESETS.find(x=>x.id===li.dataset.preset);
    drawRoute(pr.stops.map(id=>poiById[id]),{title:pr.emoji+' '+presetName(pr),intro:pr.intro});
  }));

}

/* — Режим выбора мест — */
let selecting=false; let selected=[];
const tray=document.getElementById('tray');
const trayInfo=document.getElementById('trayInfo');
const trayBuild=document.getElementById('trayBuild');
const trayCancel=document.getElementById('trayCancel');
function enterSelect(){
  selecting=true; selected=[];
  closeSheet();
  document.getElementById('fabs').classList.add('hide');
  tray.classList.add('show'); updateTray();
  toast(t('makeOwnHint'));
}
function exitSelect(){
  selecting=false;
  selected.forEach(id=>{ const el=pinEl(id); if(el) el.classList.remove('sel'); });
  selected=[];
  tray.classList.remove('show');
  document.getElementById('fabs').classList.remove('hide');
}
function toggleSelect(id){
  const i=selected.indexOf(id);
  if(i>=0){ selected.splice(i,1); const el=pinEl(id); if(el) el.classList.remove('sel'); }
  else{ selected.push(id); const el=pinEl(id); if(el) el.classList.add('sel'); }
  updateTray();
}
function updateTray(){
  trayInfo.textContent=`${t('selected')}: ${selected.length}`;
  trayCancel.textContent=t('cancel');
  trayBuild.textContent=`${t('build')} (${selected.length})`;
  trayBuild.disabled=selected.length<2;
}
trayCancel.addEventListener('click',exitSelect);
trayBuild.addEventListener('click',()=>{
  if(selected.length<2){ toast(t('needTwo')); return; }
  const pois=selected.map(id=>poiById[id]);
  drawRoute(pois,{title:t('routesTitle')});
});

/* — Построение и отрисовка маршрута — */
async function drawRoute(pois,opts={}){
  exitSelect();
  routeGroup.clearLayers();
  const coords=pois.map(p=>`${p.ll[1]},${p.ll[0]}`).join(';');
  toast(t('routing'));
  let dist=0,dur=0,ok=false,geom=null;
  try{
    const url=`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${coords}?overview=full&geometries=geojson`;
    const r=await fetch(url); const j=await r.json();
    if(j.routes&&j.routes[0]){ geom=j.routes[0].geometry; dist=j.routes[0].distance; dur=j.routes[0].duration; ok=true; }
  }catch(e){}
  if(ok){
    L.geoJSON(geom,{style:{color:'#2b7a78',weight:5,opacity:.85,lineJoin:'round'}}).addTo(routeGroup);
  }else{
    L.polyline(pois.map(p=>p.ll),{color:'#2b7a78',weight:4,opacity:.8,dashArray:'6,8'}).addTo(routeGroup);
    for(let i=0;i<pois.length-1;i++) dist+=haversine(pois[i].ll,pois[i+1].ll);
    dur=dist/1.35; toast(t('routingErr'));
  }
  pois.forEach((p,i)=>{
    const ic=L.divIcon({className:'',iconSize:[24,24],iconAnchor:[12,12],html:`<div class="stopnum">${i+1}</div>`});
    L.marker(p.ll,{icon:ic,zIndexOffset:600}).addTo(routeGroup);
  });
  try{ map.fitBounds(L.featureGroup(routeGroup.getLayers()).getBounds(),{padding:[60,60]}); }catch(e){}
  currentView={type:'route',pois:pois.map(p=>p.id),opts,dist,dur};
  renderRoute(); openSheet();
}
function renderRoute(){
  const cv=currentView; const pois=cv.pois.map(id=>poiById[id]);
  sheetTitle.textContent=cv.opts.title||t('routesTitle');
  sheetSub.textContent=t('stopsN',pois.length,fmtDist(cv.dist),fmtDur(cv.dur));
  let html='';
  if(cv.opts.intro){ html+=`<p>${cv.opts.intro}</p>`;
    if(lang!=='ru') html+=`<div class="ru-note">🇷🇺 ${t('ruOnly')}</div>`; }
  html+='<ul class="list">'+pois.map((p,i)=>
    `<li data-poi="${p.id}"><span class="num">${i+1}</span>
      <span class="nm">${poiName(p)}<small>${opName(p.op)}</small></span></li>`).join('')+'</ul>';
  sheetBody.innerHTML=html;
  sheetBody.querySelectorAll('[data-poi]').forEach(li=>li.addEventListener('click',()=>selectPoi(li.dataset.poi)));
}

/* ═══════════ УТИЛИТЫ ═══════════ */
function haversine(a,b){
  const R=6371000, toR=x=>x*Math.PI/180;
  const dLat=toR(b[0]-a[0]), dLng=toR(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function fmtDist(m){ const uM={ru:'м',en:'m',sr:'м'}[lang], uK={ru:'км',en:'km',sr:'км'}[lang];
  return m<1000? Math.round(m/10)*10+' '+uM : (m/1000).toFixed(m<10000?1:0)+' '+uK; }
function fmtDur(sec){ return Math.max(1,Math.round(sec/60))+' '+t('min'); }
let toastT=null;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),2600); }
